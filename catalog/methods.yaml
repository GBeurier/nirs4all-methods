  - method_id: "aom_pop.aom_sweep"
    family: "aom_pop.aom"
    category: "aom_pop"
    subcategory: "aom"
    since_abi: "1.16.0"
    abi_symbols:
      - "n4m_model_selection_aom_sweep_run"
