    notes: Native configurable AOM strict-linear preprocessing sweep. Compact profile has 12 chains; wide profile has 31 chains, including Gaussian, FCK and Whittaker variants. Ridge and compatible single-target NIPALS PLS1 candidates use exact operator-moment scoring when dense guards allow it; identity/SavGol/Norris/finite/FCK chains additionally use a banded moment route and detrend_poly chains use a structured low-rank moment route, with materialized fallbacks for unsupported chain/head regimes in auto mode. Repeated strict-linear prefixes are cached in bounded medium-width operator-moment grids and exposed via n_moment_prefix_cache_hits/misses. The moment_policy knob can force the legacy materialized-chain route for timing and production guarding, or force_moments/moments_only can fail fast if a candidate screen would leave operator moments. Route counters are split by head for Ridge/PLS operator-moment and materialized candidates; candidate_routes gives per-candidate route provenance without changing the stable candidate_scores shape, and Python decoded rows expose score_route_id/score_route. PLS fit-cost counters are split by route and phase via n_pls_moment_cv_fits, n_pls_materialized_cv_fits, n_pls_moment_final_fits and n_pls_materialized_final_fits. score_only=True returns ranking outputs without selected-model matrices for broad first-pass campaigns, and the result exports the flat chain descriptor (`chain_offsets`, `op_kinds`, `param_offsets`, `chain_params`) so each chain_id can be decoded through `n4m.decode_aom_chains` or `n4m.aom_candidate_table`. Python also exposes NativeAOMSweepRegressor, which uses input_coefficients folded into the original feature space for sklearn-style prediction on new X.
