    notes: "Python-backed staged strict-chain AOM preprocessing campaign over the same native chain-screen/refit helpers as `aom_pop.aom_chain_screen_refit`. It runs compact, wide, lab, focused strict-family plans such as `savgol_focus` / `strict_family_focus`, or caller-provided strict-linear score-only stages over Ridge, PLS or mixed heads, merges cross-stage global and per-head retained candidates, exact-CV refits the retained union once, and attaches preprocessing-impact plus screen-vs-refit rank diagnostics. Optional `X_audit`/`y_audit` scoring is audit-only; production selection remains train exact-CV (`selection_uses_test_set=False`) and the sklearn wrapper omits audit inputs before fitting the selected row through final-only `aom_pop.aom_chain_fixed_fit`. `NativeAOMSavgolFocusRegressor` is the fast SavGol-focused preset wrapper over this method, using the locally validated `savgol_focus` / `scale_x_values=[False, True]` recipe while preserving selected-candidate reuse. `NativeAOMStrictFamilyLiteRegressor` is the cost-safe strict-family audit preset over the same method, sampling SavGol, Norris-Williams, finite-difference, Gaussian, FCK and Whittaker stages with small screen/refit defaults and no scale grid by default. The workflow supports checkpoint/resume and `max_chunks_per_run` for incremental campaigns, one-GPU CUDA PLS route knobs through the underlying screen/refit helpers, no dataset-name routing, and no hors-moment nonlinear lifts. This is the catalogued global staged preprocessing-selection method for benchmark campaigns, not the future fused CUDA/IKPLS grinder."
