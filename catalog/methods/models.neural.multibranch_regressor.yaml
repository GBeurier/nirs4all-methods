notes: "Jointly trained multibranch neural regressor for intermediate (mid-level) multisource fusion through the shared n4m_estimator_* role API, ABI 2.22.0 unchanged. X is the concatenation of ordered blocks (optional blocks fit input; absent = one block). Each block feeds one branch declared by branch_kinds (0 dense, 1 conv1d, 2 conv2d; empty = all dense) and branch_shapes (3 ints per branch: dense/conv1d [width,1,1], conv2d HWC [H,W,C]). Branches: dense layer, or valid convolution + leaky ReLU + average pooling + dense embedding; embeddings are concatenated and a common head (optional hidden layer) regresses standardized y. All kernels, embeddings and head weights are trained jointly by backpropagation of MSE with Adam and decoupled weight decay, PCG64-seeded He/Glorot initialization and per-epoch Fisher-Yates minibatch order, for a fixed number of epochs (no early stopping, no validation split). Input/target standardization is fitted on training rows only (dense per column, conv1d per block, conv2d per channel). Transform returns the learned embeddings; the fit result holds loss_history. Fit refuses NaN/Inf (complete-data profile). No GPU, pretrained backbone or deep-learning framework parity claim."
