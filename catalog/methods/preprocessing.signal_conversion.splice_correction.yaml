notes: "Detector splice (jump) correction of multi-detector spectra (ASD, Spectral Evolution, SVC) through the shared n4m_estimator_* role API, available since project 1.5.2 with ABI 2.24.0 unchanged. splices are the first wavelengths of each following detector; segments are corrected outward from reference_segment (0-based), each matched to its corrected neighbour by the ratio (multiplicative) or difference (additive) of the mean levels of the bands within window axis units of the splice on each side (window 0: the two adjacent bands). taper spreads the correction linearly from full at the splice to none at the far end of the segment. Additive with window 0 is the specdal jump_correct convention; multiplicative with taper is spectrolab match_sensors. A segment whose factor is not finite, and those beyond it, are NaN. The fitted state is the source axis."
