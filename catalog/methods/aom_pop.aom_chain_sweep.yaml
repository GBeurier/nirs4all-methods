notes: "Native caller-provided strict-linear AOM chain sweep. Accepts flat descriptors for identity, detrend polynomial, Savitzky-Golay, Norris-Williams, finite difference, Whittaker and FCK chains; Ridge and compatible single-target NIPALS PLS1 candidates use dense, banded or structured exact operator-moment scoring where guarded, including structured low-rank detrend and pentadiagonal Whittaker transforms, with materialized fallbacks otherwise in auto mode. Repeated strict-linear prefixes are cached in bounded medium-width operator-moment grids and exposed via n_moment_prefix_cache_hits/misses. CPU auto routes Ridge p>n_train and PLS min_train<4p rows through exact materialized scorers; CUDA auto keeps the moment route. The moment_policy knob can force the legacy materialized-chain route for timing and production guarding, or force_moments/moments_only can fail fast if a candidate screen would leave operator moments. Route counters are split by head for Ridge/PLS operator-moment and materialized candidates; candidate_routes gives per-candidate route provenance without changing the stable candidate_scores shape, and Python decoded rows expose score_route_id/score_route. PLS fit-cost counters are split by route and phase via n_pls_moment_cv_fits, n_pls_materialized_cv_fits, n_pls_moment_final_fits and n_pls_materialized_final_fits. score_only=True returns ranking outputs without selected-model matrices for broad first-pass campaigns, and the result echoes the validated flat chain descriptor (`chain_offsets`, `op_kinds`, `param_offsets`, `chain_params`) so each chain_id can be decoded through `n4m.decode_aom_chains` or `n4m.aom_candidate_table`. Python also exposes `build_aom_strict_chain_grid`, `aom_chain_score_campaign`, `aom_evaluate_candidates`, `aom_candidate_rank_diagnostics`, `aom_candidate_report_records`, `aom_save_candidate_report`, `aom_load_candidate_report` and `aom_candidate_operator_summary` for deterministic strict-linear chain grids, chunked score-only execution, checkpoint/resume guarded by data/config fingerprints, bounded incremental max_chunks_per_run execution, route-counter aggregation, normalized throughput/route metrics including moment_prefix_cache_hit_fraction, PLS fit-cost metrics including pls_cv_fits_per_chain and pls_cv_fits_per_candidate, global top-k inspection, score-route summaries, operator/head candidate summaries, explicit CV-vs-holdout candidate reports, screen-recall rank diagnostics, and JSON/JSONL/CSV candidate report export/reload. NativeAOMChainSweepRegressor and NativeAOMFixedCandidateRegressor both use input_coefficients folded into the original feature space for sklearn-style prediction on new X, with the fixed-candidate wrapper intended for refitting one decoded top-k campaign row, including winners reloaded from candidate report files."
