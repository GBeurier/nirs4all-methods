notes: >-
  Direct (closed-form) multi-output Ridge: beta = (Xc'Xc + lambda I)^-1 Xc'Yc on
  column-centered X/Y, intercept = y_mean - x_mean.beta (penalty NOT applied to the
  intercept, for sklearn.linear_model.Ridge parity). Distinct from
  models.regularized.ridge_pls (n4m_ridge_pls_fit), which is ridge-AUGMENTED SIMPLS.
  AUTO solver: PRIMAL augmented-QR (p<=n) / DUAL Gram-on-samples (p>n); identical
  coefficients up to round-off. Added in G6 (release-readiness). Result keys:
  coefficients (p x q), intercept (1 x q), x_mean, x_scale (1 x p), y_mean (1 x q),
  predictions (n x q), scalar rmse, scalar lambda.
