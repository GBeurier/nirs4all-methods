[package]
name = "n4m-mixeff-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
publish = false

[lib]
name = "n4m_mixeff_backend"
crate-type = ["staticlib", "rlib"]

[dependencies]
mixeff-rs = { version = "=1.0.0-rc.5", default-features = false }
nalgebra = "0.33"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev]
debug = 0

# Independent optional native engine; do not add it to the Rust binding workspace.
[workspace]
