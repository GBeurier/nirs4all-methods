# Build, smoke-test, and publish the @nirs4all/methods npm package.
#
# This is the JS/WASM leg of the release. It mirrors the build steps of the
# js-wasm job in cross-binding-parity.yml (pinned emsdk 3.1.74) and the
# tag/publish gating of release-wheels.yml.
#
# Triggers
# --------
# - push tag v*.*.*  -> build + smoke + (non-rc) publish to npm
# - workflow_dispatch (publish input) -> build + smoke + (publish=true) publish
#
# Publish requires the NPM_TOKEN repository secret (an automation token for the
# @nirs4all org) AND that the @nirs4all npm scope is owned by the maintainer.
# Provenance (publishConfig.provenance=true in package.json) needs the
# id-token: write permission below and a public repo.
name: release-npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (true) or dry-run only (false)'
        type: boolean
        default: false
  push:
    # GitHub tag filters are globs, not regex; '-rc' tags still match here and
    # are filtered out of the publish step below.
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      # Methods-only Python packaging hotfix; the npm artifact is unchanged.
      - '!v1.0.19'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # npm provenance (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Build the WASM module (emscripten preset)
        run: |
          cmake --preset emscripten
          cmake --build --preset emscripten --target n4m_wasm

      - name: Build + stage + smoke-test the JS binding
        working-directory: bindings/js
        run: |
          npm install
          npm run build          # tsc — must compile clean
          npm run stage:wasm     # copy n4m.{js,wasm} into dist/
          npm test               # WASM smoke + generic method_result parity vs native
          npm pack --dry-run     # confirm dist/n4m.{js,wasm} + types ship

      - name: Validate tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: bindings/js
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          TAG_VER="${TAG_VER%%-rc*}"   # ignore any -rcN suffix for the match
          echo "package.json=$PKG_VER  tag=$GITHUB_REF_NAME (compare $TAG_VER)"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: package.json version ($PKG_VER) != tag ($TAG_VER). Run scripts/bump_version.sh."
            exit 1
          fi

      - name: Decide publish
        id: gate
        run: |
          # Publish on a non-rc tag push, OR on workflow_dispatch with publish=true.
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]] && [[ "${GITHUB_REF_NAME}" != *-rc* ]]; then
            echo "do=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            echo "do=true" >> "$GITHUB_OUTPUT"
          else
            echo "do=false" >> "$GITHUB_OUTPUT"
            echo "Dry-run only (no publish)."
          fi

      - name: Publish to npm (provenance)
        if: steps.gate.outputs.do == 'true'
        working-directory: bindings/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
