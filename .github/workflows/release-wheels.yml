# Build + publish the `nirs4all-methods` Python wheel (full n4m surface).
#
# Scope split with release-python.yml (which owns the slim `pls4all` wheel):
#   - `pls4all`         → release-python.yml (mature: retag, sklearn smoke,
#                         post-publish reinstall test).
#   - `nirs4all-methods`→ release-wheels.yml (THIS file). One workflow per
#                         PyPI project keeps Trusted Publishing one-to-one
#                         and prevents the dual-publish collision the two
#                         workflows had previously on the `pls4all` name.
#
# Builds one `nirs4all-methods` wheel per native platform payload:
#   - Linux x86_64 and aarch64 (manylinux 2_28)
#   - macOS universal2 (macOS 11+)
#   - Windows x86_64 (Windows Server 2022 / MSVC)
#
# The Python binding is ctypes-only and never links against CPython. After the
# platform repair step, wheels are therefore retagged from cp312-cp312 to
# py3-none while retaining their native platform tag. A separate compatibility
# matrix installs those exact wheels on CPython 3.10 through 3.14.
#
# Wheel post-processing:
#   - Linux:    auditwheel repair → tag manylinux_2_28
#   - macOS:    delocate-wheel    → bundle libn4m.dylib
#   - Windows:  delvewheel repair --analyze-existing → bundle libn4m.dll
#     (libn4m is loaded via ctypes, not linked, so delvewheel needs the
#      --analyze-existing flag to discover + vendor the DLL.)
#
# Status: ACTIVE. Builds run on tag pushes (v*.*.*) and workflow_dispatch; the
# publish job is gated on (a) tag push without `-rc`, or (b) workflow_dispatch
# with publish=true. Uses PyPI Trusted Publishing (no API tokens) — one-time
# maintainer setup on PyPI for `nirs4all-methods`: owner/repo,
# workflow file `release-wheels.yml`, environment `pypi`.

name: release-wheels

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.0-rc1)'
        required: true
        type: string
      publish:
        description: 'Publish to PyPI (else artifacts only)'
        required: true
        type: boolean
        default: false
  push:
    # GitHub tag filters are globs, not regex — '+' is literal there, so
    # 'v[0-9]+.[0-9]+.[0-9]+' never matches v0.98.0. Use '*' wildcards.
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# ACTIVE: the per-package build machinery is in place — prepare_wheel_packages.sh
# builds libn4m, generates the self-contained nirs4all-methods package dir
# (make_python_package.py --name nirs4all-methods, ships the full `n4m`
# module), and stages libn4m into it. Verified locally on Linux (wheel
# builds/installs/imports); macOS/Windows/aarch64 build on this matrix.
# Publish is gated on tag-push (non `-rc`) OR workflow_dispatch + publish=true,
# and uses PyPI Trusted Publishing (one-time maintainer setup of the publisher).
jobs:
  matrix:
    name: nirs4all-methods / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-2022
        arch:
          - x86_64
          - aarch64
        exclude:
          # macos-14 builds ONE universal2 wheel (x86_64 + arm64). macos-13 is
          # dropped: the GitHub macos-13 (Intel) runner queue is unreliable
          # (hours-long), and the universal2 wheel covers Intel Macs anyway.
          - os: macos-14
            arch: x86_64
          - os: windows-2022
            arch: aarch64
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.x'

      - name: Set up QEMU (Linux aarch64)
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      # The nirs4all-methods package dir is generated + gitignored, so it must
      # exist before cibuildwheel reads `package-dir`/pyproject.toml.
      # Materialize it here METADATA-ONLY — make_python_package.py excludes
      # lib/ (staged at build time), so this needs no compiler/toolchain on
      # any OS. libn4m is built + staged inside each build env by
      # CIBW_BEFORE_ALL (in the manylinux container on Linux) so the bundled
      # lib matches the wheel.
      - name: Materialize the nirs4all-methods package dir (metadata only)
        run: python bindings/python/scripts/make_python_package.py --name nirs4all-methods

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: bindings/python_nirs4all_methods
        env:
          CIBW_ARCHS_LINUX:   ${{ matrix.arch }}
          # macos-14 builds a single universal2 wheel (x86_64 + arm64) via the
          # ci-macos-universal2 preset below — covers Intel + Apple Silicon and
          # avoids the unreliable macos-13 runner.
          CIBW_ARCHS_MACOS:   universal2
          CIBW_ARCHS_WINDOWS: AMD64
          # Build once per platform. The bundled libn4m is CPython-independent;
          # the repaired wheel is retagged to py3-none below.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "*-musllinux_*"
          # cibuildwheel 2.21.3 pins its build deps; `latest` lets the generated
          # pyprojects' packaging>=24.2 requirement resolve.
          CIBW_DEPENDENCY_VERSIONS: latest
          CIBW_MANYLINUX_X86_64_IMAGE:  manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # Windows builds libn4m with the MSVC preset (Visual Studio generator,
          # finds the toolchain itself); Linux/macOS use the default dev-release.
          # This propagates to CIBW_BEFORE_ALL on the host-built platforms;
          # the Linux container uses build_libn4m_in_wheel.sh's dev-release default.
          PLS4ALL_BUILD_PRESET: ${{ runner.os == 'Windows' && 'ci-windows-msvc-release' || runner.os == 'macOS' && 'ci-macos-universal2' || 'dev-release' }}
          # Pin the macOS minimum so all three agree: clang/CMake build libn4m.dylib
          # with -mmacosx-version-min=11.0 (dev-release sets no CMAKE_OSX_DEPLOYMENT_TARGET,
          # so it inherits this env), cibuildwheel tags the wheel macosx_11_0_*, and
          # delocate accepts the dylib — otherwise the dylib's LC_BUILD_VERSION (the
          # runner SDK default) can exceed the advertised wheel tag and import-fail on
          # older macOS than advertised. Ignored on Linux/Windows.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Rebuild + re-stage libn4m inside each build environment so the bundled
          # lib matches the wheel (in-container glibc on Linux).
          CIBW_BEFORE_ALL_LINUX:   bash bindings/python/scripts/prepare_wheel_packages.sh
          CIBW_BEFORE_ALL_MACOS:   bash bindings/python/scripts/prepare_wheel_packages.sh
          CIBW_BEFORE_ALL_WINDOWS: bash bindings/python/scripts/prepare_wheel_packages.sh
          CIBW_BEFORE_BUILD: python -m pip install setuptools wheel
          # delvewheel is not bundled by cibuildwheel; install it for the Windows
          # repair (this override replaces the generic CIBW_BEFORE_BUILD on Windows).
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install setuptools wheel delvewheel
          # libn4m is loaded via ctypes (not linked by any extension), so the
          # Windows repair needs --analyze-existing to discover + vendor the DLL.
          # Linux auditwheel / macOS delocate already pick up the bundled lib.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --analyze-existing -w {dest_dir} -v {wheel}"
          CIBW_TEST_REQUIRES: pytest numpy scikit-learn
          CIBW_TEST_COMMAND: pytest {project}/bindings/python_nirs4all_methods/tests

      - name: Retag ctypes-only wheel cp312 to py3
        run: python bindings/python/scripts/retag_wheels.py wheelhouse --inplace

      - name: Verify portable wheel metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/nirs4all_methods-*-py3-none-*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one py3-none platform wheel, found ${#wheels[@]}" >&2
            ls -la wheelhouse/
            exit 1
          fi
          if compgen -G 'wheelhouse/*-cp*-cp*-*.whl' >/dev/null; then
            echo "::error::A CPython-specific wheel remained after retagging" >&2
            ls -la wheelhouse/
            exit 1
          fi
          python -c "import sys, zipfile; p=sys.argv[1]; z=zipfile.ZipFile(p); w=next(n for n in z.namelist() if n.endswith('.dist-info/WHEEL')); tags=[line for line in z.read(w).decode().splitlines() if line.startswith('Tag:')]; assert tags and all(line.startswith('Tag: py3-none-') for line in tags), tags; print(*tags, sep='\n')" "${wheels[0]}"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-nirs4all-methods-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.label }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            label: linux-x86_64
            runner: ubuntu-22.04
            artifact: wheels-nirs4all-methods-ubuntu-22.04-x86_64
          - python: "3.11"
            label: linux-x86_64
            runner: ubuntu-22.04
            artifact: wheels-nirs4all-methods-ubuntu-22.04-x86_64
          - python: "3.12"
            label: linux-x86_64
            runner: ubuntu-22.04
            artifact: wheels-nirs4all-methods-ubuntu-22.04-x86_64
          - python: "3.13"
            label: linux-x86_64
            runner: ubuntu-22.04
            artifact: wheels-nirs4all-methods-ubuntu-22.04-x86_64
          - python: "3.14"
            label: linux-x86_64
            runner: ubuntu-22.04
            artifact: wheels-nirs4all-methods-ubuntu-22.04-x86_64
          - python: "3.14"
            label: macos-universal2
            runner: macos-14
            artifact: wheels-nirs4all-methods-macos-14-aarch64
          - python: "3.14"
            label: windows-x86_64
            runner: windows-2022
            artifact: wheels-nirs4all-methods-windows-2022-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve expected package version
        shell: bash
        env:
          VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version_tag }}
        run: echo "N4M_VERSION=${VERSION_TAG#v}" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Install and load the exact portable wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.21" scikit-learn
          python -m pip install --no-index --find-links=wheelhouse --no-deps \
            "nirs4all-methods==${N4M_VERSION}"
          python -m pip check
          python -c "import importlib.metadata as md, os; import n4m; from n4m.estimators.regression.latent import PLS; from n4m.transform.scatter import SNV; actual=md.version('nirs4all-methods'); assert actual == os.environ['N4M_VERSION'], (actual, os.environ['N4M_VERSION']); abi=n4m.abi_version(); assert isinstance(abi, tuple) and len(abi) == 3 and abi[0] == 2, abi; assert n4m.library_path(); assert PLS is not None and SNV is not None; print('PORTABLE_WHEEL_OK', actual, abi, n4m.library_path())"

  nirs4all-python314:
    name: nirs4all 1.0.1 / Python 3.14
    needs: matrix
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Resolve expected package version
        shell: bash
        env:
          VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version_tag }}
        run: echo "N4M_VERSION=${VERSION_TAG#v}" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: wheels-nirs4all-methods-ubuntu-22.04-x86_64
          path: wheelhouse

      - name: Install the published V1 with the candidate Methods wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --find-links=wheelhouse \
            "nirs4all-methods==${N4M_VERSION}" "nirs4all==1.0.1"
          python -m pip check
          python -c "import importlib.metadata as md, os; import nirs4all; from nirs4all.operators.methods import methods_binding_status; assert md.version('nirs4all') == '1.0.1'; assert md.version('nirs4all-methods') == os.environ['N4M_VERSION']; status=methods_binding_status(); assert status['available'], status; print('NIRS4ALL_V1_PY314_OK', status)"

  publish:
    name: Publish nirs4all-methods to PyPI
    needs: [matrix, python-compatibility, nirs4all-python314]
    # Gated on either:
    #   (a) tag push v*.*.* without `-rc` (production release), or
    #   (b) workflow_dispatch + publish=true (manual dispatch).
    # Trusted Publishing requires the one-time publisher setup for
    # nirs4all-methods on PyPI: owner/repo, workflow file `release-wheels.yml`,
    # environment `pypi`.
    if: |
      (github.event_name == 'push'
       && startsWith(github.ref, 'refs/tags/v')
       && !contains(github.ref_name, '-'))
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nirs4all-methods
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: wheels-nirs4all-methods-*
          merge-multiple: true
          path: dist

      - name: Validate release version and wheel set
        shell: bash
        env:
          VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version_tag }}
        run: |
          set -euo pipefail
          ref_name="${VERSION_TAG}"
          if [[ ! "${ref_name}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Tag ${ref_name} is not a SemVer release (v<MAJOR>.<MINOR>.<PATCH>)" >&2
            exit 1
          fi
          tag_version="${ref_name#v}"
          shopt -s nullglob
          wheels=(dist/nirs4all_methods-*-py3-none-*.whl)
          if [[ ${#wheels[@]} -ne 4 ]]; then
            echo "::error::Expected four py3-none platform wheels, found ${#wheels[@]}" >&2
            ls -la dist/
            exit 1
          fi
          wheel_version=$(printf '%s\n' "${wheels[@]}" | head -n1 \
                          | sed -E 's|.*/nirs4all_methods-([0-9]+\.[0-9]+\.[0-9]+)-.*|\1|')
          if [[ "${tag_version}" != "${wheel_version}" ]]; then
            echo "::error::Tag version (${tag_version}) != wheel version (${wheel_version})" >&2
            exit 1
          fi
          echo "tag ${ref_name} matches wheel version ${wheel_version}."

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # PyPI uses Trusted Publishing — no token needed if id-token: write
          # is granted at the job level (above).

  post-publish-python314:
    name: Public PyPI / nirs4all 1.0.1 / Python 3.14
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: windows-2022
    steps:
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Install from public PyPI and verify the reported path
        shell: bash
        env:
          VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version_tag }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          installed=false
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir \
                 "nirs4all-methods==${version}" "nirs4all==1.0.1"; then
              installed=true
              break
            fi
            echo "PyPI propagation attempt ${attempt}/5 failed; retrying in 15 seconds"
            sleep 15
          done
          if [[ "${installed}" != true ]]; then
            echo "::error::Could not install nirs4all-methods ${version} from public PyPI" >&2
            exit 1
          fi
          python -m pip check
          python -c "import importlib.metadata as md; import nirs4all; from nirs4all.operators.methods import methods_binding_status; expected='${version}'; assert md.version('nirs4all') == '1.0.1'; assert md.version('nirs4all-methods') == expected; status=methods_binding_status(); assert status['available'], status; print('PUBLIC_PYPI_PY314_OK', expected, status)"
