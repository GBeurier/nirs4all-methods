name: release-n4m-crate

on:
  workflow_dispatch: {}
  push:
    tags: ["n4m-v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package and attest n4m crate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate component identity and release contract
        id: crate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python3 scripts/check_n4m_crate_release.py --workflow-contract --tag "$REF_NAME"
          else
            python3 scripts/check_n4m_crate_release.py --workflow-contract
          fi

      - name: Build the required libn4m ABI
        run: |
          cmake --preset dev-release
          cmake --build --preset dev-release --target n4m_c --parallel

      - name: Package the locked crate
        env:
          N4M_LIB_DIR: ${{ github.workspace }}/build/dev-release/cpp/src
          N4M_RUNTIME_RPATH: ${{ github.workspace }}/build/dev-release/cpp/src
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          test -f "$N4M_LIB_DIR/libn4m.so"
          cargo package --locked -p n4m
          mkdir -p dist
          cp "target/package/n4m-${CRATE_VERSION}.crate" dist/
          cargo package --locked -p n4m --list > "dist/n4m-${CRATE_VERSION}.files.txt"
          (cd dist && sha256sum "n4m-${CRATE_VERSION}.crate" > SHA256SUMS)

      - name: Attest crate provenance
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: dist/n4m-${{ steps.crate.outputs.version }}.crate

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: n4m-crate-${{ steps.crate.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish n4m to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/n4m-v')
    needs: package
    runs-on: ubuntu-22.04
    environment:
      name: crates-io
      url: https://crates.io/crates/n4m
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable

      - name: Revalidate exact tag and manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/check_n4m_crate_release.py --tag "$REF_NAME"

      - name: Build the required libn4m ABI
        run: |
          cmake --preset dev-release
          cmake --build --preset dev-release --target n4m_c --parallel

      - name: Require the protected crates.io credential and publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          N4M_LIB_DIR: ${{ github.workspace }}/build/dev-release/cpp/src
          N4M_RUNTIME_RPATH: ${{ github.workspace }}/build/dev-release/cpp/src
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is absent from the crates-io environment"
            exit 1
          fi
          test -f "$N4M_LIB_DIR/libn4m.so"
          cargo publish --locked -p n4m
